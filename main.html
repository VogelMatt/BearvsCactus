<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jungle Runner Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
        }
        #gameCanvas {
            border: 2px solid #000;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="800" height="200"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Game states
        const STATES = {
            LOADING: 'loading',
            PLAYING: 'playing',
            GAMEOVER: 'gameover',
            HIGHSCORE: 'highscore'
        };

        let gameState = STATES.LOADING;
        let selectedCharacter = 'bear';
        let highScores = JSON.parse(localStorage.getItem('highScores')) || [];
        let currentInitials = '';
        let cursorBlink = true;
        setInterval(() => cursorBlink = !cursorBlink, 500);

        const characters = {
            bear: {
                color: '#8B4513',
                name: 'Brown Bear',
                jumpHeight: 70
            },
            panda: {
                color: '#FFFFFF',
                name: 'Panda',
                jumpHeight: 80
            },
            blackBear: {
                color: '#2F2F2F',
                name: 'Black Bear',
                jumpHeight: 60
            }
        };

        const player = {
            x: 50,
            y: 150,
            width: 50,
            height: 40,
            jumping: false,
            jumpHeight: 70,
            jumpSpeed: 4
        };

        let obstacles = [];
        let score = 0;
        let gameOver = false;
        let backgroundX = 0;

        function drawLoadingScreen() {
            ctx.fillStyle = '#87CEEB';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Title
            ctx.fillStyle = '#000';
            ctx.font = 'bold 30px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('Jungle Runner', canvas.width / 2, 50);

            // Character selection
            ctx.font = '20px Arial';
            ctx.fillText('Choose Your Character:', canvas.width / 2, 80);

            // Draw character options
            Object.entries(characters).forEach(([id, char], index) => {
                const x = canvas.width / 4 + (index * canvas.width / 3);
                const y = 120;
                
                // Selection highlight
                if (selectedCharacter === id) {
                    ctx.fillStyle = '#FFD700';
                    ctx.fillRect(x - 40, y - 40, 80, 80);
                }

                // Draw character
                ctx.fillStyle = char.color;
                ctx.beginPath();
                ctx.ellipse(x, y, 20, 15, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#000';
                ctx.font = '16px Arial';
                ctx.fillText(char.name, x, y + 40);
            });

            // High Scores
            ctx.fillStyle = '#000';
            ctx.font = 'bold 20px Arial';
            ctx.fillText('High Scores:', canvas.width / 2, 180);
            
            const topScores = highScores.slice(0, 3);
            topScores.forEach((score, index) => {
                ctx.font = '16px Arial';
                ctx.fillText(`${score.initials}: ${score.score}`, canvas.width / 2, 200 + (index * 20));
            });

            // Instructions
            ctx.font = '14px Arial';
            ctx.fillText('Use LEFT/RIGHT arrows to select character, SPACE to start', canvas.width / 2, canvas.height - 20);
        }

        function drawHighScoreScreen() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#FFF';
            ctx.font = 'bold 30px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('New High Score!', canvas.width / 2, 80);
            
            ctx.font = '20px Arial';
            ctx.fillText(`Score: ${score}`, canvas.width / 2, 120);
            
            ctx.fillText('Enter Your Initials:', canvas.width / 2, 160);
            ctx.fillText(currentInitials + (cursorBlink ? '_' : ''), canvas.width / 2, 190);
        }

        // ... [Previous drawing functions remain the same: drawPlayer, drawCactus, drawObstacles, etc.]
        // [Include all the previous functions here, they remain unchanged]

        function handleKeyPress(e) {
            if (gameState === STATES.LOADING) {
                if (e.code === 'ArrowLeft') {
                    const chars = Object.keys(characters);
                    const currentIndex = chars.indexOf(selectedCharacter);
                    selectedCharacter = chars[currentIndex > 0 ? currentIndex - 1 : chars.length - 1];
                } else if (e.code === 'ArrowRight') {
                    const chars = Object.keys(characters);
                    const currentIndex = chars.indexOf(selectedCharacter);
                    selectedCharacter = chars[currentIndex < chars.length - 1 ? currentIndex + 1 : 0];
                } else if (e.code === 'Space') {
                    gameState = STATES.PLAYING;
                    player.jumpHeight = characters[selectedCharacter].jumpHeight;
                }
            } else if (gameState === STATES.PLAYING && e.code === 'Space') {
                jump();
            } else if (gameState === STATES.HIGHSCORE) {
                if (e.code === 'Enter' && currentInitials.length > 0) {
                    highScores.push({ initials: currentInitials, score });
                    highScores.sort((a, b) => b.score - a.score);
                    localStorage.setItem('highScores', JSON.stringify(highScores));
                    resetGame();
                } else if (e.key.length === 1 && currentInitials.length < 3) {
                    currentInitials += e.key.toUpperCase();
                } else if (e.code === 'Backspace') {
                    currentInitials = currentInitials.slice(0, -1);
                }
            } else if (gameState === STATES.GAMEOVER && e.code === 'Space') {
                resetGame();
            }
        }

        function resetGame() {
            gameState = STATES.LOADING;
            gameOver = false;
            obstacles = [];
            score = 0;
            currentInitials = '';
            backgroundX = 0;
        }

        function checkHighScore() {
            return highScores.length < 3 || score > highScores[highScores.length - 1].score;
        }

        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (gameState === STATES.LOADING) {
                drawLoadingScreen();
            } else if (gameState === STATES.PLAYING) {
                drawJungleBackground();
                drawGround();
                drawPlayer();
                drawObstacles();
                updateObstacles();
                drawScore();

                if (checkCollision()) {
                    if (checkHighScore()) {
                        gameState = STATES.HIGHSCORE;
                    } else {
                        gameState = STATES.GAMEOVER;
                    }
                    gameOver = true;
                } else {
                    score++;
                }
            } else if (gameState === STATES.HIGHSCORE) {
                drawHighScoreScreen();
            } else if (gameState === STATES.GAMEOVER) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#FFF';
                ctx.font = '40px Arial';
                ctx.fillText('Game Over', canvas.width / 2, canvas.height / 2);
                ctx.font = '20px Arial';
                ctx.fillText(`Final Score: ${score}`, canvas.width / 2, canvas.height / 2 + 40);
                ctx.fillText('Press Space to Restart', canvas.width / 2, canvas.height / 2 + 80);
            }

            requestAnimationFrame(gameLoop);
        }

        document.addEventListener('keydown', handleKeyPress);
        gameLoop();
    </script>
</body>
</html>
